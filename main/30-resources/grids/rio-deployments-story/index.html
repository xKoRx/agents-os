<!doctype html><html lang="es"><meta charset="utf-8"><title>Deployments — propuesta visual</title><style>body{margin:0;background:#06070b;color:#e4e4e8;font:16px system-ui}header{height:66px;display:flex;align-items:center;justify-content:center;gap:14px}button{background:#161820;border:1px solid #333;border-radius:8px;color:#bbb;padding:9px 15px;font:inherit;cursor:pointer}button.active{color:#ffe600;border-color:#ffe600}iframe{display:block;width:1280px;height:720px;border:0;margin:auto}small{color:#6c6e7a}</style><header><b>Un deployment, de punta a punta</b> <button data-s="1" class="active">1</button><button data-s="2">2</button><button data-s="3">3</button><button data-s="4">4</button><button data-s="5">5</button><button data-s="6">6</button><small>Preview visual · Dark Theme</small></header><iframe id="stage" src="01.html" title="Deployment — capítulo 1"></iframe><script>let n=1;function go(v){n=Math.max(1,Math.min(6,v));document.getElementById('stage').src=String(n).padStart(2,'0')+'.html';document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',Number(b.dataset.s)===n));}document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.s))));document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(n+1);if(e.key==='ArrowLeft')go(n-1);});</script></html>
