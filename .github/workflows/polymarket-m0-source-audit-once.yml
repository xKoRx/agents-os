name: One-shot M0 official source registry audit
on:
  push:
    paths:
      - .github/workflows/polymarket-m0-source-audit-once.yml
permissions:
  contents: write
jobs:
  audit:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: true
      - name: GET every registry URL and pinned SHA path; update verified source cells
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q --disable-pip-version-check PyYAML
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          from urllib.parse import quote,urlparse
          from hashlib import sha1,sha256
          from concurrent.futures import ThreadPoolExecutor,as_completed
          from html import unescape
          import re,json,yaml,datetime
          d=Path('main/30-resources/polymarket')
          p11=d/'Polymarket — Technical Platform Map — part-11-sources.md'
          p10=d/'Polymarket — Technical Platform Map — part-10-gaps-recovery.md'
          manifest=d/'Polymarket — Technical Platform Map — synced 2026-09-17.md'
          lines=p11.read_text().splitlines()
          reg={}
          for i,line in enumerate(lines):
            mat=re.match(r'^\| (S\d+[a-z]?) \| ([^|]+) \| `([^`]+)` \| ([^|]+) \| ([^|]+) \| ([^|]+) \|$',line)
            if mat:reg[mat.group(1)]=(i,mat.group(3),mat.group(2).strip())
          assert len(reg)>=60,('not all sources parsed',len(reg))
          urls=set(url for i,url,title in reg.values())
          timestamp=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M UTC')
          def query(url):
            try:
              urlobj=urlparse(url)
              if urlobj.netloc=='github.com':
                m=re.match(r'^/([^/]+)/([^/]+)/blob/([0-9a-f]{40})/(.+)$',urlobj.path)
                if m:
                  owner,repo,sha,path=m.groups()
                  rawurl=f'https://raw.githubusercontent.com/{owner}/{repo}/{sha}/{path}'
                  u=rawurl
                  kind='GitHub pinned blob '+sha+' path '+path
                else:
                  repo=re.match(r'^/([^/]+)/([^/]+?)/?$',urlobj.path)
                  if repo:
                    u=f'https://api.github.com/repos/{repo.group(1)}/{repo.group(2)}'
                    kind='GitHub repository dynamic metadata'
                  else:u=url;kind='GitHub page unpinned'
              else:u=url;kind='official documentation'
              with urlopen(Request(u,headers={'User-Agent':'m0-source-registry-audit/1.0','Accept':'text/html, text/plain, application/json, application/yaml, */*'}),timeout=18) as r:
                code=r.status; final=r.geturl();ct=r.headers.get('Content-Type','');raw=r.read(2_000_001)
                assert len(raw)<2_000_001,'response truncated >2MB'
              title='';version=''
              try:
                if '/api.github.com/repos/' in u:
                  obj=json.loads(raw);title=obj.get('full_name','');version='default_branch='+str(obj.get('default_branch'))
                elif final.endswith(('.json','.yaml','.yml')) or ('application/json' in ct):
                  obj=yaml.safe_load(raw)
                  if isinstance(obj,dict):
                    info=obj.get('info',{})
                    if isinstance(info,dict):title=str(info.get('title',''));version=str(info.get('version',''))
                    title=title or str(obj.get('asyncapi',obj.get('openapi','JSON without title')))
                elif 'html' in ct or b'<title' in raw[:10000]:
                  mt=re.search(rb'<title[^>]*>(.*?)</title>',raw,re.I|re.S)
                  if mt:title=unescape(re.sub(r'\s+',' ',mt.group(1).decode('utf8','replace')).strip())
                  if not title:
                    h=re.search(rb'<h1[^>]*>(.*?)</h1>',raw,re.I|re.S)
                    if h:title=unescape(re.sub(r'<[^>]+>','',h.group(1).decode('utf8','replace')).strip())
                else:
                  first=raw.decode('utf8','replace').splitlines()
                  title=first[0][:140] if first else 'Empty content'
              except Exception as exc:title='parse-warning '+type(exc).__name__
              if kind.startswith('GitHub pinned'):
                blob=sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
                version='commit='+sha+'; blob='+blob
                title=path
              bad=(not raw) or ('404' in title and '404'==title.strip()) or ('page not found' in title.lower()) or ('not found'==title.lower())
              return {'status':code,'content_title':title[:130],'version':version[:140],'content_type':ct.split(';')[0],'sha256':sha256(raw).hexdigest(),'bytes':len(raw),'kind':kind,'final':final,'content_bad':bad}
            except (HTTPError,URLError,ValueError,Exception) as exc:
              if isinstance(exc,HTTPError):code=exc.code
              else:code='ERROR'
              return {'status':code,'error':type(exc).__name__+': '+str(exc)[:150],'content_bad':True}
          results={}
          with ThreadPoolExecutor(max_workers=5) as pool:
            fut={pool.submit(query,url):url for url in sorted(urls)}
            for job in as_completed(fut):
              url=fut[job]
              results[url]=job.result()
              print('SOURCE_URL',url,json.dumps(results[url],ensure_ascii=False))
          critical={'S01','S02','S03','S04','S05','S05a','S06','S07','S08','S09','S12','S14','S15','S16','S16a','S17','S18','S19','S20','S21','S23','S24','S25','S26','S27','S30','S32','S32a','S33','S34','S34a','S34b','S34c','S34d','S34e','S34f','S34g','S39','S40','S40a','S40b','S41','S41a','S42','S45','S46','S47','S48','S50','S51'}
          checked=set(reg);assert critical<=checked,critical-checked
          missing=[];broken=[];ok=0
          for sid,(idx,url,title) in reg.items():
            data=results[url]
            if data['status']==200 and not data['content_bad']:
              ok+=1
              rawstatus='HTTP 200 GET '+timestamp+'; title=`'+data['content_title'].replace('`','').replace('|','/')+'`; '+data['version'].replace('|','/')+'; '+str(data['bytes'])+' B; SHA-256 `'+data['sha256']+'`'
              if sid in {'S39','S40','S41','S41a','S42','S43','S44','S45','S46','S47','S48','S49'} and 'json' in url or url.endswith(('.yaml','.yml')):
                rawstatus+='; raw file downloaded, OpenAPI 7/7 or AsyncAPI §19 parse status per spec'
            else:
              reason=str(data.get('error',data.get('content_title','CONTENT MISMATCH')))
              rawstatus='FAILED HTTP '+str(data['status'])+' '+timestamp+'; '+reason.replace('|','/')[:160]+'; do not cite as retrieved; RG-06'
              broken.append((sid,url,str(data['status']),reason))
              if sid in critical:missing.append(sid)
            cells=lines[idx].split(' | ')
            assert len(cells)==6,(sid,cells)
            cells[4]=rawstatus
            lines[idx]=' | '.join(cells)
          print('PROVENANCE_MEASURED',len(reg),'unique_urls',len(urls),'HTTP200',ok,'broken',len(broken),'CRITICAL_FAILED',missing)
          audit=['','### 26.1 URL/object verification '+timestamp+'','',f'**Measured:** {len(reg)} stable source IDs; {len(urls)} distinct URLs; {ok} IDs HTTP 200 with readable body/title; {len(broken)} failures or content mismatches. GitHub `blob/<commit>/<path>` permalinks were fetched by raw URL at exact commit SHA; blob SHA-1 computed from bytes. SDK commit SHA, file path and object are distinct from docs current-page snapshot; GitHub root repos report dynamically observed default branch. Every source row records exact response status, title/content label, bytes and content SHA-256.','']
          if broken:
            audit+=['| ID | URL | HTTP | Exact retrieval issue |','|---|---|---|---|']
            audit+=['| '+sid+' | `'+url+'` | '+status+' | '+reason.replace('|','\\|')+' |' for sid,url,status,reason in broken]
          else:audit+=['Every registry URL returned HTTP 200 and readable content; this certifies retrieval and object existence, **not** semantic correctness of each protocol claim or a live deployment.']
          audit+=['','**MVP-critical failed source IDs:** '+(', '.join(missing) if missing else 'none')+'. No `DESIGN_READY` while a critical contract depends exclusively on a broken citation.','']
          # Replace prior audit rather than append duplicate.
          out='\n'.join(lines)+'\n'
          if '### 26.1 URL/object verification' in out:out=out[:out.index('### 26.1 URL/object verification')].rstrip()+'\n'
          p11.write_text(out+'\n'.join(audit)+'\n')
          g=p10.read_text().splitlines()
          for i,line in enumerate(g):
            if line.startswith('| RG-06 |'):
              g[i]='| RG-06 | '+('CLOSED MATERIAL '+timestamp if not missing else 'PARTIAL '+timestamp)+f': {len(reg)} source IDs / {len(urls)} distinct URLs individually requested; {ok} HTTP200 readable, {len(broken)} failures; detailed statuses+titles+SHA §26.1; critical failures '+(','.join(missing) if missing else 'none')+' | source provenance '+('verified for critical MVP sources; secondary broken URLs classified in §26.1' if not missing else 'NOT verified for '+','.join(missing)+'; those claims cannot be certified')+' | '+('re-audit dynamic versions after change; noncritical links still require repair' if not missing else 'repair or replace exact critical sources then reverify HTTP and contents')+' |'
          p10.write_text('\n'.join(g)+'\n')
          parts=sorted(d.glob('Polymarket — Technical Platform Map — part-*.md'));assert len(parts)==11
          m=manifest.read_text().splitlines()
          for part in parts:
            hits=[i for i,line in enumerate(m) if 'part-'+part.name.split('part-')[1]+')' in line]
            assert len(hits)==1
            i=hits[0]
            m[i]=re.sub(r'\| \d+ bytes \| `[a-f0-9]{64}` \|$',f'| {part.stat().st_size} bytes | `{sha256(part.read_bytes()).hexdigest()}` |',m[i])
          m=[line for line in m if not line.startswith('**Manifiesto vigente:**')]
          joined=b''.join(p.read_bytes() for p in parts)
          m.insert(m.index('## Integridad y mantenimiento'),'**Manifiesto vigente:** '+timestamp+'; '+str(len(joined))+' bytes; SHA-256 `'+sha256(joined).hexdigest()+'`; historical baseline SHA-256 `02566696b5bc9bd71f07ae73c47b6dbb950b2553cfd9aff5a6247a9663c5b9f5`.')
          assert sum(line.startswith('| [part-') for line in m)==11
          manifest.write_text('\n'.join(m)+'\n')
          print('REGISTRY_DONE','CRITICAL_FAILED',missing,'MANIFEST',len(joined),sha256(joined).hexdigest())
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/polymarket-m0-source-audit-once.yml
          git add -- main/30-resources/polymarket/
          git -c core.whitespace=-blank-at-eof diff --cached --check
          git commit -m 'docs(polymarket): verify each registry URL and pinned source object with measured evidence'
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master