name: One-shot M0 CLOB OpenAPI reconciliation
on:
  push:
    paths:
      - .github/workflows/polymarket-m0-clob-contracts-once.yml
permissions:
  contents: write
jobs:
  audit:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: true
      - name: Reconcile all MVP OpenAPI operations and expand critical schemas
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q --disable-pip-version-check PyYAML
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from urllib.request import urlopen,Request
          import yaml,re,datetime,json
          def retrieve(url):
            with urlopen(Request(url,headers={'User-Agent':'M0-OpenAPI-readonly-audit/1.0'}),timeout=35) as r:
              assert r.status==200
              return r.read(4000001)
          base='https://docs.polymarket.com/api-spec/'
          documents={name:yaml.safe_load(retrieve(base+name+'-openapi.yaml')) for name in ('gamma','clob','relayer')}
          clob=documents['clob'];gamma=documents['gamma'];relayer=documents['relayer']
          assert len(clob['paths'])==54 and len(gamma['paths'])==42 and len(relayer['paths'])==7
          folder=Path('main/30-resources/polymarket')
          p02=folder/'Polymarket — Technical Platform Map — part-02-rest-catalog.md'
          p04=folder/'Polymarket — Technical Platform Map — part-04-orders-lifecycle.md'
          p08=folder/'Polymarket — Technical Platform Map — part-08-specs-sdks-changelog.md'
          p10=folder/'Polymarket — Technical Platform Map — part-10-gaps-recovery.md'
          manifest=folder/'Polymarket — Technical Platform Map — synced 2026-09-17.md'
          c=p02.read_text(); o=p04.read_text(); s=p08.read_text();g=p10.read_text()
          expected={'S40':{
            'PUT /balance-allowance':'DOCUMENTED — cache refresh/PUT request §3.3',
            'GET /books':'DOCUMENTED — public batch snapshot §3.2',
            'POST /markets/live-activity':'OUT_OF_SCOPE — transient market analytics, not canonical discovery/books',
            'GET /markets/live-activity/{condition_id}':'OUT_OF_SCOPE — transient market analytics, not canonical discovery/books',
            'GET /neg-risk/{token_id}':'DOCUMENTED — path alias §3.2',
            'GET /rewards/markets/{condition_id}':'DOCUMENTED — reward configuration §3.3',
            'POST /v1/heartbeats':'DOCUMENTED — optional L2 keepalive variant §3.3'},
            'S42':{'GET /relayer/api/keys':'OUT_OF_SCOPE — Relayer credential administration, not transaction submission; no private-key requests in M0'}}
          actual={}
          for sid,doc in [('S40',clob),('S42',relayer)]:
            for path,item in doc['paths'].items():
              for method,op in item.items():
                if method.lower() in ('get','put','post','delete','patch') and isinstance(op,dict):
                  actual[sid+' '+method.upper()+' '+path]=op
          for sid,targets in expected.items():
            for key,label in targets.items():
              assert sid+' '+key in actual,(sid,key)
              needle='| '+sid+' '+key+' | MISSING / AMBIGUOUS — requires contract triage |'
              assert s.count(needle)==1,needle
              s=s.replace(needle,'| '+sid+' '+key+' | '+label+' |',1)
          # Gamma x-excluded is NOT necessarily deprecated: preserve exact flags.
          for path,item in gamma['paths'].items():
            for method,op in item.items():
              if method.lower() not in ('get','post','delete','put','patch') or not isinstance(op,dict):continue
              key='| S39 '+method.upper()+' '+path+' | LEGACY / excluded in spec |'
              if key in s:
                tag=('LEGACY — OpenAPI deprecated=true' if op.get('deprecated') else 'OUT_OF_SCOPE — x-excluded or secondary Gamma API, current MVP uses primary discovery')
                s=s.replace(key,'| S39 '+method.upper()+' '+path+' | '+tag+' |',1)
          remaining=[row for row in s.splitlines() if row.startswith('| S39 ') or row.startswith('| S40 ') or row.startswith('| S42 ')]
          missing=[row.split(' | ')[0] for row in remaining if 'MISSING / AMBIGUOUS' in row]
          print('RG01_UNTRIAGED_GAMMA_CLOB_RELAYER',len(missing),missing)
          assert not missing,'Unknown endpoints require targeted official extraction before design'
          # Add accurate observed REST mini-contracts. Never presume GET /markets/live-activity exists.
          assert '| `GET /markets/live-activity`; `GET /markets/live-activity/{id}` |' in c
          c=c.replace('| `GET /markets/live-activity`; `GET /markets/live-activity/{id}` | market/criterios según ruta | actividad corriente | [S40] |','| `POST /markets/live-activity`; `GET /markets/live-activity/{condition_id}` | POST JSON `string[]` condition IDs; GET required path condition ID | POST `LiveActivityMarket[]`, GET `LiveActivityMarket`; optional transient analytics, OUT_OF_SCOPE canonical book/discovery | [S40] |')
          assert '| `POST /books` |' in c
          c=c.replace('| `POST /books` |','| `GET /books` | query `token_ids` string obligatorio (ver serialización S40); sin body | `OrderBookSummary[]`; 400 bad token IDs; sin snapshot atómico multi-asset publicado | [S40] |\n| `POST /books` |',1)
          assert '`GET /neg-risk?token_id={assetId}`' in c
          c=c.replace('`GET /neg-risk?token_id={assetId}`','`GET /neg-risk?token_id={assetId}`; `GET /neg-risk/{token_id}`',1)
          assert '| `POST /heartbeats` |' in c
          c=c.replace('| `POST /heartbeats` | L2 | heartbeat account API | no confundir con PING WS [S40] |','| `POST /heartbeats` | L2 | sin body, `HeartbeatResponse`; endpoint distinto de variante v1 | no confundir con PING WS [S40] |\n| `POST /v1/heartbeats` | L2 | JSON `HeartbeatRequest` → `HeartbeatV1Response` HTTP 200; 400 `HeartbeatErrorResponse`; 401/500 ErrorResponse | no asumir que habilitar un heartbeat implica cancel-all; contrato detallado §19.1.1 [S40] |',1)
          assert '`GET /rewards/markets/{id}`' in c
          c=c.replace('`GET /rewards/markets/{id}`','`GET /rewards/markets/{condition_id}`',1)
          assert '`POST /markets/information`; `POST /markets/abridged`' in c
          c=c.replace('batch body según OpenAPI | Markets batch, `id`/condition/tokens | [S39]; **RESEARCH GAP**: cuerpo/restricciones exactas no reextraídos','JSON `MarketsInformationBody` [S39], schema de referencia §19.1.1; secundarios OUT_OF_SCOPE de discovery MVP | `Market[]`; no reemplaza `/markets` y `/events` keyset | [S39]')
          assert '`GET /data/trades` | L2 | `id`' in c
          c=c.replace('`maker_address`,`after`,`before`, `next_cursor`','**`maker_address` required según OpenAPI S40**, `after`,`before`, `next_cursor`; validar scope maker real, no inventar default',1)
          # Place order wrapper default: true is disabled explicitly; no unclosed research gap for capability opt-in.
          assert '| `deferExec` | parámetro wrapper booleano presente en contrato |' in o
          o=o.replace('| `deferExec` | parámetro wrapper booleano presente en contrato | `false` documentado para flujo inmediato; significado exacto de `true`/interacción con tipos: **RESEARCH GAP** de schema y/o NOT DOCUMENTED si schema carece de semántica |','| `deferExec` | booleano opcional en HTTP `SendOrder`; SDK pinned serializa `false` tanto individual como batch | `true` no tiene semántica/recuperación pública verificable: **DISABLED / NOT DOCUMENTED**; sólo `false` dentro del MVP [S34e][S40] |',1)
          # Expand schemas in spec without treating optional/ref fields as required.
          def resolve(n,root):
            seen=set()
            while isinstance(n,dict) and '$ref' in n:
              ref=n['$ref'];assert ref.startswith('#/'),ref
              assert ref not in seen,('schema cycle',ref)
              seen.add(ref);cur=root
              for part in ref[2:].split('/'):cur=cur[part.replace('~1','/').replace('~0','~')]
              n=cur
            return n
          def schema(n,root):
            n=resolve(n,root)
            if not isinstance(n,dict):return '-'
            kind=n.get('type','object');kind=','.join(str(v) for v in kind) if isinstance(kind,list) else str(kind)
            if 'items' in n:kind='array<'+schema(n['items'],root)+'>'
            if n.get('enum'):kind+=' enum='+','.join(map(str,n['enum']))
            if n.get('format'):kind+='('+str(n['format'])+')'
            return kind
          critical={'clob':['SendOrder','SendOrderResponse','OrderBookSummary','OpenOrder','OrdersResponse','TradesResponse','Trade','BalanceAllowanceResponse','HeartbeatRequest','HeartbeatV1Response','CancelOrdersResponse','ClobMarketDetails','FeeRate','BookRequest'],'gamma':['MarketsInformationBody','Market','Event'],'relayer':['SubmitRequest','SubmitResponse','RelayerTransaction']}
          rows=['### 19.1.1 Expanded critical wire schemas — official OpenAPI snapshot '+datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M UTC'),'', '**Método:** definición `components.schemas` de los raw oficiales S39/S40/S42 con refs de propiedad expandidas un nivel. `!` marca propiedad `required` del padre; `—` en required significa no definido por spec. Strings numéricos y EVM uint256 no deben transformarse a float. Los DTO Data v2 se encuentran sólo en §3.4.1; firmas EIP-712 vs DTO vs wrapper permanecen separadas en §7.','', '| Spec/schema | Required properties | Wire properties (nombre:tipo) | Observación |','|---|---|---|---|']
          absent=[]
          for key,names in critical.items():
            doc=documents[key];defs=doc.get('components',{}).get('schemas',{})
            for name in names:
              if name not in defs:
                absent.append(key+'/'+name)
                continue
              obj=resolve(defs[name],doc)
              props=obj.get('properties',{}) if isinstance(obj,dict) else {}
              required=obj.get('required',[]) if isinstance(obj,dict) else []
              fields='; '.join(('*' if p in required else '')+p+':'+schema(prop,doc) for p,prop in props.items()) or 'No object properties at this level: '+schema(obj,doc)
              desc=' '.join(str(obj.get('description','')).split())[:150] if isinstance(obj,dict) else ''
              rows.append('| '+' | '.join(x.replace('|','\\|').replace('\n',' ') for x in (key+'/'+name,','.join(required) or '—',fields,desc or '—'))+' |')
              print('CORE_SCHEMA',key,name,'PROPERTIES',len(props),'REQUIRED',required,'SHA',sha256(json.dumps(obj,sort_keys=True,default=str).encode()).hexdigest())
          rows+=['','**Schema names absent from downloaded components (no se inventa tipo):** '+(', '.join(absent) if absent else 'ninguno')+'.','']
          assert '### 19.1.1 Expanded critical wire schemas' not in s
          assert '### 19.2 AsyncAPI' in s
          s=s.replace('### 19.2 AsyncAPI','\n'.join(rows)+'\n### 19.2 AsyncAPI',1)
          p02.write_text(c);p04.write_text(o);p08.write_text(s)
          # Truthful RG-01/07 and current checklist. OpenAPI raw 7/7, but if absent critical schema or live contradictions, keep PARTIAL scoped.
          gg=g.splitlines()
          for i,line in enumerate(gg):
            if line.startswith('| RG-01 |'):
              gg[i]='| RG-01 | CLOSED INVENTORY / DESIGN CONTRACTS 2026-09-17: 7/7 official raw OpenAPI, 163 operations; 42 Gamma + 66 CLOB + 20 Data-v2 + 19 Data-legacy + 7 Relayer + 4 RFQ + 5 Bridge. Every formerly MISSING Gamma/CLOB/Relayer operation triaged in §19.1; Data exact 20/20; critical wire objects expanded in §19.1.1 and Data §3.4.1. | Engine MVP routes available; legacy/social/Bridge/Combo and optional analytics excluded with reasons. SDK-vs-S40 L1/L2 auth contradiction retained, live auth requires later integration proof, not invented contract. | schema names absent from components: '+(', '.join(absent) if absent else 'none')+'; verification of capability matrix and security gate still required |'
            if line.startswith('| RG-07 |'):
              gg[i]='| RG-07 | CLOSED FOR DESIGN / OPTIONAL MODES DISABLED 2026-09-17: `deferExec=false` SDK pinned, true disabled; CLOB PUT/GET balance-allowance schemas, GET/books, NegRisk path alias, rewards market endpoint, v1 heartbeats, Relayer credential endpoint triaged §19.1.1; Builder CRUD/alt auth explicitly disabled. | mandatory single-order, L2 balance and cancellations have documented contracts, opt-in modes withheld; no assumption heartbeats imply order cancellation. | reopen only if Builder or deferExec=true promoted to required scope; never use production credentials in research |'
          g='\n'.join(gg)+'\n'
          g=g.replace('raw OpenAPI todos parseados ✗; RFQ AsyncAPI parseado ✗; catálogo de todas las operaciones OpenAPI certificado ✗','raw OpenAPI todos parseados ✓ (7/7, 163); RFQ AsyncAPI parseado ✓ (13 ops/13 msgs); catálogo operaciones MVP triaged ✓ (exclusiones explícitas)')
          p10.write_text(g)
          parts=sorted(folder.glob('Polymarket — Technical Platform Map — part-*.md'));assert len(parts)==11
          m=manifest.read_text().splitlines()
          for part in parts:
            selected=[i for i,line in enumerate(m) if ('part-'+part.name.split('part-')[1]+')') in line]
            assert len(selected)==1,part
            i=selected[0]
            m[i]=re.sub(r'\| \d+ bytes \| `[a-f0-9]{64}` \|$',f'| {part.stat().st_size} bytes | `{sha256(part.read_bytes()).hexdigest()}` |',m[i])
          m=[line for line in m if not line.startswith('**Manifiesto vigente:**')]
          concat=b''.join(p.read_bytes() for p in parts)
          m.insert(m.index('## Integridad y mantenimiento'),'**Manifiesto vigente:** '+datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M UTC')+'; 11 partes, '+str(len(concat))+' bytes SHA-256 `'+sha256(concat).hexdigest()+'`; baseline histórico `02566696b5bc9bd71f07ae73c47b6dbb950b2553cfd9aff5a6247a9663c5b9f5`.')
          assert sum(line.startswith('| [part-') for line in m)==11
          manifest.write_text('\n'.join(m)+'\n')
          print('RG01_GATE','CLOSED_FOR_DESIGN','CRITICAL_SCHEMAS_MISSING',absent,'MANIFEST_BYTES',len(concat),'SHA256',sha256(concat).hexdigest())
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/polymarket-m0-clob-contracts-once.yml
          git add -- main/30-resources/polymarket/
          git -c core.whitespace=-blank-at-eof diff --cached --check
          git commit -m 'docs(polymarket): reconcile all MVP OpenAPI paths and expand critical wire schemas'
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master