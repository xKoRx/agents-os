name: One-shot fix Polymarket M0 contracts workflow
on:
  push:
    paths:
      - .github/workflows/polymarket-m0-fix-contracts-once.yml
permissions:
  contents: write
jobs:
  fix:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair single assertion and retrigger existing contract audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/polymarket-m0-contracts-once.yml')
          s=p.read_text()
          assert s.count('assert len(cols)==4') == 1
          p.write_text(s.replace('assert len(cols)==4','assert len(cols)==3'))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/polymarket-m0-fix-contracts-once.yml
          git add -- .github/workflows/polymarket-m0-contracts-once.yml
          git diff --cached --check
          git commit -m 'fix(polymarket): correct checkpoint row arity'
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master