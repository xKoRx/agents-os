name: One-shot Polymarket M0 RG01
on:
  push:
    paths:
      - .github/workflows/polymarket-m0-rg01-once.yml
permissions:
  contents: write
jobs:
  audit:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: true
      - name: Download and parse official specs; persist measured inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q PyYAML
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          import json, re, datetime, yaml

          folder = Path('main/30-resources/polymarket')
          part02 = (folder / 'Polymarket — Technical Platform Map — part-02-rest-catalog.md').read_text()
          p08 = folder / 'Polymarket — Technical Platform Map — part-08-specs-sdks-changelog.md'
          p10 = folder / 'Polymarket — Technical Platform Map — part-10-gaps-recovery.md'
          manifest = folder / 'Polymarket — Technical Platform Map — synced 2026-09-17.md'
          specs = [
            ('S39','Gamma','https://docs.polymarket.com/api-spec/gamma-openapi.yaml'),
            ('S40','CLOB','https://docs.polymarket.com/api-spec/clob-openapi.yaml'),
            ('S41','Data v2','https://data-api.polymarket.com/v2/openapi.json'),
            ('S41a','Data legacy','https://docs.polymarket.com/api-spec/data-openapi.yaml'),
            ('S42','Relayer','https://docs.polymarket.com/api-spec/relayer-openapi.yaml'),
            ('S43','Combo/RFQ','https://docs.polymarket.com/api-spec/combos-rfq-openapi.yaml'),
            ('S44','Bridge','https://docs.polymarket.com/api-spec/bridge-openapi.yaml'),
          ]
          def schema(s):
            if not isinstance(s,dict): return '-'
            if '$ref' in s: return s['$ref'].split('/')[-1]
            if 'items' in s: return 'array['+schema(s['items'])+']'
            if 'oneOf' in s or 'anyOf' in s:
              return 'union['+','.join(schema(i) for i in s.get('oneOf',s.get('anyOf',[])))+']'
            props=s.get('properties',{})
            return ('{'+','.join(('*' if k in s.get('required',[]) else '')+k for k in props)+'}') if props else s.get('type','-')
          def body(b):
            if not isinstance(b,dict): return '-'
            if '$ref' in b: return schema(b)
            return ';'.join(t+':'+schema(c.get('schema',{})) for t,c in b.get('content',{}).items()) or '-'
          def get_json(u):
            req=Request(u,headers={'User-Agent':'polymarket-m0-contract-audit/1.0','Accept':'application/json, text/yaml, application/yaml, */*'})
            with urlopen(req,timeout=35) as r:
              raw=r.read(10_000_001)
              if len(raw)>10_000_000: raise ValueError('spec >10MB')
              return raw,r.status,r.headers.get('Content-Type','')
          def read_spec(raw):
            x=yaml.safe_load(raw)
            if not isinstance(x,dict) or not isinstance(x.get('paths'),dict): raise ValueError('Missing OpenAPI paths map')
            return x
          ts=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M UTC')
          catalog=set((verb,route.split('?')[0].split('#')[0]) for verb,route in re.findall(r'`(GET|POST|PUT|PATCH|DELETE)\s+(/[^`\s;]+)',part02))
          entries=[]; failures=[]; total=0; target=[]
          for sid,label,url in specs:
            try:
              raw,http,ctype=get_json(url)
              s=read_spec(raw)
              path_count=len(s['paths']); n=0; counts={}
              for path,item in sorted(s['paths'].items()):
                if not isinstance(item,dict): continue
                for method,op in item.items():
                  if method.lower() not in ('get','post','put','patch','delete','head','options','trace') or not isinstance(op,dict): continue
                  verb=method.upper(); n+=1
                  listed=(verb,path) in catalog
                  if label=='Data legacy': status='LEGACY — Data v1 frozen'
                  elif label=='Bridge': status='OUT_OF_SCOPE — funding/withdrawal, not matching MVP'
                  elif label=='Combo/RFQ': status='OUT_OF_SCOPE — deferred conditional capability, not core engine'
                  elif op.get('deprecated') or op.get('x-excluded'): status='LEGACY / excluded in spec'
                  elif listed: status='DOCUMENTED'
                  elif re.search(r'/(comments?|profiles?|public-profile|tweet-count|creators|pagination)(/|$)',path): status='OUT_OF_SCOPE — social/profile metadata'
                  else: status='MISSING / AMBIGUOUS — requires contract triage'
                  counts[status]=counts.get(status,0)+1
                  params=[]
                  for p in (item.get('parameters',[])+op.get('parameters',[])):
                    if not isinstance(p,dict): continue
                    if '$ref' in p: params.append('ref:'+p['$ref'].split('/')[-1]); continue
                    params.append(('!' if p.get('required') else '')+p.get('in','?')+':'+p.get('name','?')+':'+schema(p.get('schema',{})))
                  response=[]
                  for code,response_obj in op.get('responses',{}).items():
                    if not isinstance(response_obj,dict): continue
                    response.append(str(code)+':'+body(response_obj))
                  security=op.get('security',s.get('security',[]))
                  sec=','.join('+'.join(o.keys()) for o in security if isinstance(o,dict)) if isinstance(security,list) else str(security)
                  if not sec: sec='public / unspecified'
                  info=f'{sid} {verb} {path}'
                  entries.append((info,status,op.get('operationId','—'),sec,', '.join(params) or '—',body(op.get('requestBody',{})),'; '.join(response) or 'NOT SPECIFIED'))
                  if re.search(r'orderbook-history|/v2/resolutions|/order$|/orders$|/data/trades|/data/order|balance-allowance|/submit$|auth/api-key|/book$',path,re.I):
                    target.append((info,json.dumps({'parameters':params,'requestBody':op.get('requestBody'),'responses':op.get('responses'),'security':security,'operationId':op.get('operationId')},ensure_ascii=False,default=str)[:15000]))
              total+=n
              print('SPEC',sid,label,'HTTP',http,'CONTENT_TYPE',ctype,'BYTES',len(raw),'SHA256',sha256(raw).hexdigest(),'INFO',s.get('info',{}).get('title'),s.get('info',{}).get('version'),'OPENAPI',s.get('openapi'),'SERVERS',json.dumps(s.get('servers',[]),ensure_ascii=False)[:400],'SECURITY_SCHEMES',json.dumps(s.get('components',{}).get('securitySchemes',{}),ensure_ascii=False)[:1000],'PATHS',path_count,'OPERATIONS',n,'STATUS',json.dumps(counts,ensure_ascii=False))
              entries.append((f'{sid} SPEC HEADER','MEASURED',str(s.get('info',{}).get('title',''))+' / '+str(s.get('info',{}).get('version','')),json.dumps(s.get('servers',[]),ensure_ascii=False),'OpenAPI '+str(s.get('openapi',''))+'; SHA256 '+sha256(raw).hexdigest(),str(len(raw))+' bytes; '+str(path_count)+' paths; '+str(n)+' operations',url))
            except Exception as e:
              reason=type(e).__name__+': '+str(e)[:200]
              failures.append((sid,url,reason))
              print('SPEC_FAILED',sid,url,reason)
          assert entries, 'Zero raw specs fetched; no claims or writes permitted'
          print('RG01_ACTUAL_TOTAL',total,'RETRIEVED',len(specs)-len(failures),'FAILED',len(failures),'CATALOG_LITERAL_MATCHES',len(catalog))
          for name,details in target: print('TARGET_SCHEMA',name,details)
          section=['### 19.1 OpenAPI — extracción mecánica, snapshot '+ts,'','**Método:** descarga HTTP raw de las siete URLs [S39]–[S44], parseo YAML/JSON real (`yaml.safe_load`), inventario de `paths`, métodos, `operationId`, parámetros, `requestBody`, respuestas y `security`; clasificación literal método/path contra §3 (comparación literal puede producir falsos negativos por nombres de parámetros/rutas, por eso se etiqueta `MISSING / AMBIGUOUS` hasta triage). Un valor documentado en esta tabla refleja el spec descargado, no una prueba live. `!` marca parámetro obligatorio; schema `*campo` marca propiedad obligatoria. Tipos de payload representados por referencias del OpenAPI, no inventados.','',f'**Fecha de extracción:** {ts}. **Operaciones realmente parseadas:** {total}. **Specs recuperados:** {len(specs)-len(failures)}/7. **Specs fallidos:** {len(failures)}.','', '| Operación/spec | Clasificación / razón | operationId o título | Seguridad / servers | Parámetros / meta | Request body | Response status y schema / URL |','|---|---|---|---|---|---|---|']
          for ent in entries:
            esc=[str(c).replace('|','\\|').replace('\n',' ') for c in ent]
            section.append('| '+' | '.join(esc)+' |')
          if failures:
            section+=['','**Descargas sin éxito (NO PARSEADO, no atribuir cobertura):**']
            section += ['- '+sid+' '+url+' — '+why for sid,url,why in failures]
          section+=['','**Gate RG-01:** inventario medido, pero la clasificación `MISSING / AMBIGUOUS` requiere resolver o excluir cada ruta MVP; los schemas referenciados requieren expansión contractual de órdenes, reconciliación, posiciones y resolución antes de marcar PASS. Ver §24.','']
          content=p08.read_text()
          start=content.index('### 19.1 OpenAPI')
          end=content.index('### 19.2 AsyncAPI',start)
          p08.write_text(content[:start]+'\n'.join(section)+'\n'+content[end:])
          gap=p10.read_text()
          needle='| RG-01 | OpenAPI YAML Gamma/CLOB/Relayer/Combo/Bridge + Data legacy, Data v2 JSON [S39][S40][S41][S42][S43][S44][S41a] no descargados/parseados mecánicamente en esta sesión; conteos y comparación operación→catálogo NO MEDIDOS | no certificar totalidad endpoints CURRENT ni input/output de ramas secundarias | obtener raw spec, parsear `paths`, seguridad, servers, operation IDs y diff con §3; documentar/OUT_OF_SCOPE cada operación |'
          assert needle in gap, 'RG-01 row changed; fail closed'
          replacement=f'| RG-01 | PARTIAL {ts}: se descargaron y parsearon {len(specs)-len(failures)}/7 specs, {total} operaciones, inventario operación→§3 en §19.1; fallaron {len(failures)} descargas; pendientes triage literal/expansión DTO crítica | los paths clasificados `MISSING / AMBIGUOUS` y fuentes sin extraer impiden DESIGN_READY hasta resolver contratos MVP; no confundir inventario con cobertura integral | resolver omisiones reales por capability, request/response y auth; documentar exclusiones con razón verificable, después PASS |'
          p10.write_text(gap.replace(needle,replacement,1))
          m=manifest.read_text(); parts=sorted(folder.glob('Polymarket — Technical Platform Map — part-*.md'))
          assert len(parts)==11
          for part in parts:
            data=part.read_bytes()
            row=r'(?m)^(\| \[[^\]]+\]\(\./'+re.escape(part.name).replace('\\ ','%20')+r'\) \|[^\n]*? \| )\d+ bytes \| `[a-f0-9]{64}` \|$'
            # Replace via filename-safe capture instead of decoding percent-encoded path.
            lines=m.splitlines()
            matching=[i for i,line in enumerate(lines) if ('part-'+part.name.split('part-')[1]+')') in line]
            assert len(matching)==1,(part.name,matching)
            ix=matching[0]
            lines[ix]=re.sub(r'\| \d+ bytes \| `[a-f0-9]{64}` \|$',f'| {len(data)} bytes | `{sha256(data).hexdigest()}` |',lines[ix])
            m='\n'.join(lines)+'\n'
          combined=b''.join(p.read_bytes() for p in parts)
          newmeta=f'**Manifiesto vigente:** verificado {ts}; concatenación actual de las 11 partes en orden: {len(combined)} bytes; SHA-256 `{sha256(combined).hexdigest()}`. Baseline original histórico inmutable: `02566696b5bc9bd71f07ae73c47b6dbb950b2553cfd9aff5a6247a9663c5b9f5`.'
          m=re.sub(r'(?m)^\*\*Manifiesto vigente:\*\*.*\n','',m)
          m=m.replace('## Integridad y mantenimiento',newmeta+'\n\n## Integridad y mantenimiento',1)
          manifest.write_text(m)
          print('MANIFEST_CURRENT',len(combined),sha256(combined).hexdigest(),'ELEVEN_LINKS',sum('part-' in line and line.startswith('| [') for line in m.splitlines()))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/polymarket-m0-rg01-once.yml
          git add -- main/30-resources/polymarket/Polymarket*part-08* main/30-resources/polymarket/Polymarket*part-10* main/30-resources/polymarket/Polymarket*synced* || git add -- main/30-resources/polymarket/
          git -c core.whitespace=-blank-at-eof diff --cached --check
          git commit -m 'docs(polymarket): measure official OpenAPI inventory and checkpoint RG-01'
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master